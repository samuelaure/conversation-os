services:
  postgres:
    image: postgres:16-alpine
    container_name: cos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cos_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cos_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cos_user} -d ${POSTGRES_DB:-cos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cos_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cos_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cos_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cos_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cos_network:
    driver: bridge
